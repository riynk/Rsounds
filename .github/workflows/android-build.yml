name: Android build verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-main
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build FOSS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, formatting checks, and build
        run: ./gradlew --no-daemon test spotlessCheck :app:assembleFossDebug

      - name: Upload FOSS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rsounds-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
